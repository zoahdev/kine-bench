name: Evidence integrity

on:
  push:
    branches: [main]
    paths:
      - "results/KW_RISK_CARD_v0.json"
      - "results/kw_exp_0006_analysis.json"
      - "results/kw_exp_0006_cluster_audit.json"
      - "docs/product/KINEWORLD_RISK_CARD_v0.md"
      - "verification/**"
      - "tests/test_risk_card_v0.py"
      - ".github/workflows/evidence-integrity.yml"
  pull_request:
    paths:
      - "results/KW_RISK_CARD_v0.json"
      - "results/kw_exp_0006_analysis.json"
      - "results/kw_exp_0006_cluster_audit.json"
      - "docs/product/KINEWORLD_RISK_CARD_v0.md"
      - "verification/**"
      - "tests/test_risk_card_v0.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen artifacts
        run: python verification/scripts/verify_risk_card_v0.py
      - name: Run risk-card consistency tests
        run: python -m unittest tests.test_risk_card_v0 -v
